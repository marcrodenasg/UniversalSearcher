<!DOCTYPE html>
<html>
<head>
    <title>The Bench | Archive</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <input type="text" id="aiIn" placeholder="Search (e.g. 'white t-shirt')">
    
    <div id="out" class="grid">
        {% for p in products %}
            {% set display_label = p.shop if p.shop and p.shop|lower != 'ebay' else 'eBay' %}
            <div class="card" data-shop="{{ display_label|lower|replace(' ', '') }}">
                <span class="shop-tag">{{ display_label }}</span>
                <img src="{{ p.imageUrl }}" referrerpolicy="no-referrer" onerror="this.src='https://ui-avatars.com/api/?name=No+Image';">
                <span class="brand">{{ p.brandName }}</span>
                <span class="product-name">{{ p.productName }}</span>
                <p>${{ p.price }}</p>
                <a href="{{ p.productUrl }}" target="_blank" class="link-btn">LINK</a>
            </div>
        {% endfor %}
    </div>

    <script>
        const i = document.getElementById('aiIn');
        const o = document.getElementById('out');

        i.onkeypress = async (e) => {
            if (e.key === 'Enter') {
                const val = i.value.trim();
                if (val === "") { window.location.href = "/"; return; }

                o.style.opacity = "0.3";

                const res = await fetch('/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: val })
                });
                
                const data = await res.json();

                o.innerHTML = data.map(p => {
                    var itemLink = p.productUrl || p.url || "#";
                    var itemShop = (p.shop || "Archive").toUpperCase();
                    var itemPrice = p.price || "0.00";
                    var itemName = p.productName || "";
                    var itemBrand = p.brandName || "";
                    var itemImg = p.imageUrl || "https://via.placeholder.com/200";
                    
                    // FIXED: Corrected missing '+' signs and image attributes
                    return '<div class="card" data-shop="' + (p.shop ? p.shop.toLowerCase() : "") + '">' +
                        '<span class="shop-tag">' + itemShop + '</span>' +
                        '<img src="' + itemImg + '" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\'https://ui-avatars.com/api/?name=No+Image\';">' +
                        '<span class="brand">' + itemBrand + '</span>' +
                        '<span class="product-name">' + itemName + '</span>' +
                        '<p>$' + itemPrice + '</p>' +
                        '<a href="' + itemLink + '" target="_blank" class="link-btn">VIEW ON ' + itemShop + '</a>' +
                        '</div>';
                }).join('');

                o.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
