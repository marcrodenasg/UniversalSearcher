<!DOCTYPE html>
<html>
<head>
    <title>Vestiare Shop</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <input type="text" id="aiIn" placeholder="Search (e.g. 'white t-shirt')">
    <div id="out" class="grid">
        {% for p in products %}
        <div class="card">
            <span class="shop-tag">{{ p.Shop }}</span>
            <img src="{{ p.imageUrl }}">
            <p><b style="color:red;">{{ p.brandName }}</b></p>
            <p><strong>{{ p.productName }}</strong></p>
            <p>${{ p.price }}</p>
            <a href="{{ p.productUrl }}" target="_blank">LINK</a>
        </div>
        {% endfor %}
    </div>

    <script>
        const i = document.getElementById('aiIn');
        const o = document.getElementById('out');

        i.onkeypress = async (e) => {
            if (e.key === 'Enter') {
                o.style.opacity = "0.3"; // visual animation
                o.style.pointerEvents = "none"

                const res = await fetch('/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: i.value })
                });
                const data = await res.json();

                o.innerHTML = data.map(p => `
                    <div class="card">
                        <span class="shop-tag">${p.Shop}</span>
                        <img src="${p.imageUrl}">
                        <p><b style="color:red;">${p.brandName}</b></p>
                        <p><strong>${p.productName}</strong></p>
                        <p>$${p.price}</p>
                        <div class="links">
                            <a href="${p.productUrl}" target="_blank" class="buy-btn">VIEW ON ${p.Shop.toUpperCase()}</a>
                        </div>
                    </div>
                `).join('');

                o.style.opacity = "1";
                o.style.pointerEvents = "auto";
            }
        };
    </script>
</body>
</html>
