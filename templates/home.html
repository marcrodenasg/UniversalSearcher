<!DOCTYPE html>
<html>
<head>
    <title>The Bench | Archive</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <input type="text" id="aiIn" placeholder="Search (e.g. 'white t-shirt')">
    
    <div id="out" class="grid">
        {% for p in products %}
            {% set display_label = p.shop if p.shop and p.shop|lower != 'ebay' else 'eBay' %}
            <div class="card" data-shop="{{ display_label|lower|replace(' ', '') }}">
                <span class="shop-tag">{{ display_label }}</span>
                <img src="{{ p.imageUrl }}" onerror="this.src='https://via.placeholder.com/200?text=No+Image';">
                <span class="brand">{{ p.brandName }}</span>
                <span class="product-name">{{ p.productName }}</span>
                <p>${{ p.price }}</p>
                <a href="{{ p.productUrl }}" target="_blank">LINK</a>
            </div>
        {% endfor %}
    </div>

    <script>
        const i = document.getElementById('aiIn');
        const o = document.getElementById('out');

        const fixUrl = (url) => {
            if (!url) return 'https://via.placeholder.com/200';
            return url.startsWith('//') ? 'https:' + url : url;
        };

        i.onkeypress = async (e) => {
            if (e.key === 'Enter') {
                const val = i.value.trim();

                // --- NEW LOGIC: Empty search resets to randomized feed ---
                if (val === "") {
                    window.location.href = "/"; 
                    return;
                }

                // Start search animation
                o.style.opacity = "0.3";

                const res = await fetch('/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: val })
                });
                
                const data = await res.json();

                // Render the blended results
                o.innerHTML = data.map(p => {
                    let label = p.shop || 'eBay'; 
                    if (label.toLowerCase() === 'ebay') label = 'eBay';

                    return `
                        <div class="card" data-shop="${label.toLowerCase().replace(' ', '')}">
                            <span class="shop-tag">${label}</span>
                            <img src="${fixUrl(p.imageUrl)}" onerror="this.src='https://via.placeholder.com/200?text=No+Image';">
                            <span class="brand">${p.brandName || ''}</span>
                            <span class="product-name">${p.productName || ''}</span>
                            <p>$${p.price || '0.00'}</p>
                            <a href="${p.productUrl}" target="_blank">LINK</a>
                        </div>
                    `;
                }).join('');

                o.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
